name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tokens JSON is valid
        run: python3 -m json.tool brand-tokens.json > /dev/null
      - name: VERSION matches top CHANGELOG entry
        run: |
          v="$(cat VERSION)"
          top="$(grep -m1 -oE '^## v[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sed 's/## v//')"
          [ "$v" = "$top" ] || { echo "VERSION $v != CHANGELOG $top"; exit 1; }
      - name: Site tokens are current
        run: python3 scripts/embed-tokens.py --check
      - name: Internal links resolve
        run: |
          python3 - <<'PY'
          import re, os, glob, sys
          bad = 0
          for f in glob.glob('**/*.md', recursive=True):
              for m in re.finditer(r'\]\(([^)#\s]+)(#[^)]*)?\)', open(f).read()):
                  t = m.group(1)
                  if t.startswith(('http', 'mailto:')): continue
                  if not os.path.exists(os.path.normpath(os.path.join(os.path.dirname(f), t))):
                      print(f"broken: {f} -> {t}"); bad += 1
          sys.exit(1 if bad else 0)
          PY
      - name: No private content (public repo guard)
        run: |
          ! grep -rniE 'rockrequests|jotform\.com|rock\.houstonsfirst\.org|sharepoint|nguyen\.nguyen@|ai-use-policy\.md|promotion-playbook\.md|glossary\.md' --include='*.md' --include='*.json' --include='*.html' --exclude=AGENTS.md --exclude=PULL_REQUEST_TEMPLATE.md . || { echo "Private reference found in a public repo"; exit 1; }
